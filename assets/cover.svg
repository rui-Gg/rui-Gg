<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Engineer the system. Make intelligence useful.</title>
<desc id="desc">A warm sunrise over a minimal cloud infrastructure and connected AI network illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101d31"/>
    <stop offset=".55" stop-color="#17384b"/>
    <stop offset="1" stop-color="#245565"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe3b0" stop-opacity=".95"/>
    <stop offset="1" stop-color="#f6a879" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ee7d8"/>
    <stop offset="1" stop-color="#82baff"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24495d"/>
    <stop offset="1" stop-color="#142b40"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c5e6eb" stroke-opacity=".075"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/>
