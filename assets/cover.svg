<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Build systems. Explore possibilities.</title>
<desc id="desc">A modern cloud infrastructure inspired banner with a warm sunrise, network connections, server layers and a bright horizon.</desc>
<defs>
