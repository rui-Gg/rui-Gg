<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Rui — Cloud, Systems, Automation</title>
<desc id="desc">A minimal midnight-blue technical landscape with a warm horizon and subtle network connections.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1726"/>
    <stop offset=".55" stop-color="#142c40"/>
    <stop offset="1" stop-color="#244653"/>
  </linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f0b98e" stop-opacity="0"/>
    <stop offset=".55" stop-color="#f0b98e" stop-opacity=".9"/>
    <stop offset="1" stop-color="#70d7d0" stop-opacity=".1"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
