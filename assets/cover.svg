<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Stay curious, take the scenic route</title>
  <desc id="desc">A warm sunrise over distant mountains, rolling hills and a winding road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d8b4"/>
      <stop offset="48%" stop-color="#f4bda2"/>
      <stop offset="100%" stop-color="#8fbfd0"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5d7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffd7a3" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#829e9c"/>
      <stop offset="100%" stop-color="#6e8c8c"/>
    </linearGradient>
    <linearGradient id="nearHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#496f70"/>
      <stop offset="100%" stop-color="#294d54"/>
